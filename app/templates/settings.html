{% extends 'base.html' %}{% from 'macros.html' import art,csrf with context %}
{% block content %}<section class="page-intro">{{ art(7,'medium-art') }}<h1>내 신문의 기준.</h1><p class="muted">처음 정해두면 매일 다시 입력할 필요 없어요.</p></section><form method="post" class="settings-form form-stack">{{ csrf() }}<div class="two-columns"><label>기사 속 나의 이름<input name="display_name" required maxlength="20" value="{{ g.user.display_name }}"></label><label>신문 이름<input name="newspaper_name" required maxlength="30" value="{{ g.user.newspaper_name }}"></label><label>시간대<select name="timezone">{% for z in ['Asia/Seoul','Asia/Tokyo','Etc/UTC','America/New_York','Europe/London'] %}<option {% if z==g.user.timezone %}selected{% endif %}>{{ z }}</option>{% endfor %}</select></label><label>날씨 지역<select name="city">{% for c in cities %}<option {% if c==g.user.city %}selected{% endif %}>{{ c }}</option>{% endfor %}</select></label></div><label>응원 팀 <span class="optional">선택 · 경기 API 준비 중</span><input name="team" maxlength="60" value="{{ g.user.team }}" placeholder="내가 응원하는 팀"></label><p class="small muted">운세는 오락용 문구이며 실제 사주 계산은 제공하지 않아요.<br>사진과 기록은 기본적으로 나만 볼 수 있어요.</p><button class="primary">설정 저장</button></form>{% endblock %}
