{% extends 'base.html' %}{% from 'macros.html' import csrf with context %}{% block content %}<section class="page-intro"><h1>휴지통</h1><p class="muted">삭제한 원본을 복원할 수 있어요. 기존 발행본에는 영향이 없어요.</p></section>{% for e in entries %}<div class="trash-row"><div><span class="small">{{ e.date }} · {{ topics[e.topic].name }}</span><h3>{{ e.title }}</h3></div><form method="post" action="{{ url_for('web.restore_entry',eid=e.id) }}">{{ csrf() }}<button class="subtle">복원</button></form></div>{% else %}<p class="empty-state">휴지통이 비어 있어요.</p>{% endfor %}{% endblock %}
