{% extends 'base.html' %}{% from 'macros.html' import csrf with context %}{% block content %}<section class="page-intro"><p class="eyebrow">EDITOR'S DESK</p><h1>내 말에 더 가깝게.</h1><p class="muted">수정해서 발행하면 새 버전으로 저장돼요. 기존 신문과 공유 링크는 그대로 유지돼요.</p></section><form method="post" class="edit-news form-stack">{{ csrf() }}<label>1면 헤드라인<input name="headline" value="{{ content.headline }}" required maxlength="120"></label><label>오늘의 작은 특종<textarea name="gossip" rows="3" maxlength="600">{{ content.gossip }}</textarea></label>{% for article in content.articles %}<fieldset><legend>{{ article.reporter }}</legend><label>기사 제목<input name="title_{{ loop.index0 }}" value="{{ article.title }}" required maxlength="120"></label><label>본문<textarea name="body_{{ loop.index0 }}" rows="9" required maxlength="10000">{{ article.body }}</textarea></label></fieldset>{% endfor %}<button class="primary">수정본 발행하기 →</button></form>{% endblock %}
